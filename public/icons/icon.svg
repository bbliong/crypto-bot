<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </radialGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />

  <!-- Sniper Crosshair Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#ringGrad)" stroke-width="8" opacity="0.85" filter="url(#glow)" />
  <circle cx="256" cy="256" r="140" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="3" stroke-dasharray="8 6" />

  <!-- Crosshair Ticks -->
  <line x1="256" y1="56" x2="256" y2="100" stroke="#10b981" stroke-width="6" stroke-linecap="round" />
  <line x1="256" y1="412" x2="256" y2="456" stroke="#10b981" stroke-width="6" stroke-linecap="round" />
  <line x1="56" y1="256" x2="100" y2="256" stroke="#10b981" stroke-width="6" stroke-linecap="round" />
  <line x1="412" y1="256" x2="456" y2="256" stroke="#10b981" stroke-width="6" stroke-linecap="round" />

  <!-- Center Lightning Bolt -->
  <polygon points="268,140 185,265 252,265 228,375 330,245 264,245" fill="url(#boltGrad)" filter="url(#glow)" />
  <polygon points="266,165 205,260 252,260 238,345 310,250 262,250" fill="#fff" opacity="0.4" />
</svg>
