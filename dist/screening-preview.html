<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GMGN Young Token Screening</title>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    :root{color-scheme:dark;--bg:#090d18;--panel:#11182a;--line:#26334d;--text:#e8edf8;--muted:#8b99b4;--mint:#5eead4;--red:#fb7185;--amber:#fbbf24}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 0 0,#152342,transparent 34rem),var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif}main{max-width:1440px;margin:auto;padding:2rem}header{display:flex;justify-content:space-between;gap:1rem;align-items:flex-start;margin-bottom:1.4rem}h1,p{margin:0}h1{font-size:1.55rem}.sub,.small{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.8rem;margin:1rem 0}.card,.table{background:#11182a;border:1px solid var(--line);border-radius:14px}.card{padding:1rem}.label{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.metric{font-size:1.6rem;font-weight:750;margin-top:.2rem}.table{overflow:auto}table{width:100%;min-width:900px;border-collapse:collapse}th,td{padding:.8rem 1rem;text-align:left;border-bottom:1px solid #26334d}th{font-size:.75rem;text-transform:uppercase;color:var(--muted)}tr:last-child td{border:0}.token{font-family:ui-monospace,Consolas,monospace}.token a{color:var(--text);text-decoration:none}.token a:hover{color:var(--mint)}.coin{display:flex;gap:.6rem;align-items:center}.coin img{width:28px;height:28px;border-radius:8px;object-fit:cover;background:#18223a}.badge{display:inline-block;padding:.2rem .48rem;margin:.1rem;border-radius:999px;background:#482030;color:#ffb0be;font-size:.76rem;font-weight:700}.empty{padding:3rem;text-align:center;color:var(--muted)}@media(max-width:760px){main{padding:1rem}header{display:block}.cards{grid-template-columns:1fr}}
  </style>
</head>
<body><main x-data="preview()" x-init="load();setInterval(load,5000)">
  <header><div><h1>Token Muda yang Gagal Screening</h1><p class="sub">Umur 0–900 detik · auto-refresh tiap 5 detik</p></div><div class="small" x-text="stamp"></div></header>
  <section class="cards"><div class="card"><div class="label">Token muda ditolak</div><div class="metric" x-text="data?.summary?.rejectedYoungTokens ?? '—'"></div></div><div class="card"><div class="label">Gagal holder</div><div class="metric" x-text="data?.summary?.failedChecks?.holders ?? 0"></div></div><div class="card"><div class="label">Gagal likuiditas</div><div class="metric" x-text="data?.summary?.failedChecks?.liquidityUsd ?? 0"></div></div></section>
  <section class="table"><table x-show="data?.rows?.length"><thead><tr><th>Token</th><th>Umur saat ditolak</th><th>Holder</th><th>Likuiditas</th><th>Alasan</th><th>Waktu</th></tr></thead><tbody><template x-for="row in data?.rows" :key="row.mint"><tr><td><div class="coin"><img x-show="row.imageUrl" :src="row.imageUrl" @error="$el.style.display='none'"><div><strong x-text="row.name || row.symbol || short(row.mint)"></strong><div class="small token"><a :href="'https://gmgn.ai/sol/token/'+row.mint" target="_blank" x-text="short(row.mint)"></a></div></div></div></td><td x-text="seconds(row.ageSeconds)"></td><td x-text="number(row.holders,0)"></td><td x-text="money(row.liquidityUsd)"></td><td><template x-for="reason in row.reasons"><span class="badge" x-text="reason.name+': '+reason.detail"></span></template></td><td class="small" x-text="time(row.observedAt)"></td></tr></template></tbody></table><div class="empty" x-show="data && !data.rows?.length">Belum ada token muda yang gagal screening.</div></section>
</main><script>function preview(){return{data:null,stamp:'Memuat…',async load(){try{let r=await fetch('/research-preview-data.json?'+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();this.data=await r.json();this.stamp='Run '+this.data.runFolder+' · '+this.time(this.data.generatedAt)}catch{this.stamp='Preview belum tersedia'}},number(v,d=2){return v===null||v===undefined?'—':new Intl.NumberFormat('id-ID',{maximumFractionDigits:d}).format(v)},money(v){return v===null||v===undefined?'—':new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',notation:'compact',maximumFractionDigits:2}).format(v)},seconds(v){return v===null?'—':v<60?this.number(v,1)+' dtk':this.number(v/60,1)+' mnt'},short(v){return v?v.slice(0,5)+'…'+v.slice(-5):'—'},time(v){return new Date(v).toLocaleTimeString('id-ID')}}}</script></body></html>
