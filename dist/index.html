<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GMGN Signal Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23090d18'/%3E%3Cpath d='M17 41V23h8l7 11 7-11h8v18h-7V32l-8 12-8-12v9z' fill='%235eead4'/%3E%3C/svg%3E">
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    :root { color-scheme: dark; --bg:#090d18; --panel:#11182a; --line:#26334d; --text:#e8edf8; --muted:#8b99b4; --mint:#5eead4; --blue:#75a7ff; --red:#fb7185; --amber:#fbbf24; }
    * { box-sizing:border-box } body { margin:0; min-width:320px; background:radial-gradient(circle at 0 0,#152342 0,transparent 33rem),var(--bg); color:var(--text); font:15px/1.45 Inter,ui-sans-serif,system-ui,sans-serif; }
    main { max-width:1440px; margin:auto; padding:2rem; } h1,h2,p { margin:0 } header { display:flex; justify-content:space-between; gap:1rem; align-items:flex-start; margin-bottom:1.4rem; } h1 { font-size:1.55rem; letter-spacing:-.03em } .sub { color:var(--muted); margin-top:.3rem } .stamp { text-align:right; font-size:.82rem; color:var(--muted) }
    .cards { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:.8rem; margin-bottom:1rem } .card,.table-wrap { background:color-mix(in srgb,var(--panel) 93%,transparent); border:1px solid var(--line); border-radius:14px; } .card { padding:1rem } .label { color:var(--muted); font-size:.78rem; text-transform:uppercase; letter-spacing:.07em } .metric { margin-top:.25rem; font-size:1.5rem; font-weight:750; letter-spacing:-.04em } .mint { color:var(--mint) } .toolbar { display:flex; flex-wrap:wrap; gap:.5rem; margin:1rem 0 } button { border:1px solid var(--line); background:#18223a; color:var(--text); border-radius:999px; padding:.48rem .78rem; cursor:pointer; font:inherit } button.active { border-color:var(--mint); color:var(--mint); background:#10302f }
    .table-wrap { overflow:auto } table { width:100%; border-collapse:collapse; min-width:960px } th { color:var(--muted); font-size:.74rem; text-transform:uppercase; letter-spacing:.06em; text-align:left; padding:.85rem 1rem; border-bottom:1px solid var(--line) } td { padding:.8rem 1rem; border-bottom:1px solid color-mix(in srgb,var(--line) 65%,transparent); vertical-align:middle } tr:last-child td { border:0 } .token { font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-weight:650 } .token a { color:inherit; text-decoration:none } .token a:hover { color:var(--mint) } .small { color:var(--muted); font-size:.82rem } .badge { display:inline-flex; padding:.2rem .52rem; border-radius:999px; font-size:.75rem; font-weight:700; } .entry_ready,.pass { background:#123b35;color:#7cf5d9 }.watch,.warn { background:#443517;color:#fcd36a }.reject,.fail { background:#471c2a;color:#ff9aae }.insufficient_evidence,.unknown { background:#222b3e;color:#b6c1d8 }
    .rule { min-width:8.3rem }.bar { height:6px; background:#26334d; border-radius:99px; overflow:hidden; margin-top:.32rem }.bar span { display:block; height:100%; background:linear-gradient(90deg,var(--blue),var(--mint)); border-radius:inherit }.change.up { color:var(--mint) }.change.down { color:var(--red) } details summary { cursor:pointer; color:var(--blue); white-space:nowrap } .checks { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:.4rem; padding:.8rem 0; min-width:660px }.check { padding:.45rem .6rem; border:1px solid var(--line); border-radius:8px; font-size:.78rem }.empty { text-align:center; padding:4rem 1rem; color:var(--muted) } .error { color:var(--red); font-size:.9rem }
    @media (max-width:850px) { main{padding:1rem}.cards{grid-template-columns:repeat(2,minmax(0,1fr))} header{display:block}.stamp{text-align:left;margin-top:.7rem} }
    .detail-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:.8rem; margin-bottom:1rem }.detail-panel { padding:1rem; margin-bottom:1rem }.detail-panel h2 { font-size:1rem; margin-bottom:.8rem }.activity-table { width:100%; min-width:620px; border-collapse:collapse }.activity-table th,.activity-table td { padding:.55rem .65rem; border-bottom:1px solid color-mix(in srgb,var(--line) 65%,transparent); text-align:left }
  </style>
</head>
<body>
  <main x-data="dashboard()" x-init="load(); setInterval(load, 2000)">
    <header>
      <div><h1>GMGN Signal Dashboard</h1><p class="sub">WebSocket → risk gate → laporan → Fomo manual review</p></div>
      <div class="stamp"><div x-text="generatedAt ? 'Snapshot ' + formatTime(generatedAt) : 'Memuat snapshot…'"></div><div x-show="error" class="error" x-text="error"></div></div>
    </header>
    <template x-if="selected">
      <div>
        <section class="table-wrap detail-panel"><div style="display:flex;justify-content:space-between;gap:1rem;align-items:flex-start;flex-wrap:wrap"><div style="display:flex;gap:.8rem;align-items:center"><img x-show="selected.imageUrl" :src="selected.imageUrl" @error="$el.style.display='none'" alt="" style="width:48px;height:48px;border-radius:12px;object-fit:cover;background:#18223a"><div><div class="label" x-text="data.selection.stage==='ACTIVE_MONITOR' ? 'Token aktif untuk trading' : 'Token detail sedang dianalisis'"></div><h2 x-text="selected.name || selected.symbol || selected.mint"></h2><div class="small"><span x-show="selected.symbol" x-text="'$'+selected.symbol+' · '"></span><a class="token" :href="'https://fomo.family/tokens/solana/'+selected.mint" target="_blank" rel="noopener" x-text="short(selected.mint)"></a></div><div class="small" x-text="data.selection.stage==='ACTIVE_MONITOR' ? 'Dipantau sampai '+formatTime(data.selection.until) : 'Mengambil data detail dan menghitung rule'"></div></div></div><span class="badge" :class="selected.status.toLowerCase()" x-text="selected.status.replaceAll('_',' ')"></span></div></section>
        <section class="detail-grid"><div class="card"><div class="label">Validitas</div><div class="metric mint" x-text="selected.validPercent+'%'"></div><div class="small" x-text="selected.pass+' dari '+selected.totalRules+' rule lulus'"></div></div><div class="card"><div class="label">Buy / Sell WS</div><div class="metric" x-text="selected.buyObserved+' / '+selected.sellObserved"></div><div class="small" x-text="selected.traderCount+' trader unik terdeteksi'"></div></div><div class="card"><div class="label">Holder</div><div class="metric" x-text="number(selected.holders,0)"></div><div class="small" x-text="selected.holderChange===null?'Perubahan belum ada':delta(selected.holderChange,0)"></div></div><div class="card"><div class="label">Likuiditas</div><div class="metric" x-text="money(selected.liquidityUsd)"></div><div class="small" x-text="'MC '+money(selected.marketCapUsd)"></div></div></section>
        <section class="table-wrap detail-panel"><h2>Analisis distribusi holder</h2><div class="detail-grid" style="margin:0"><div class="card"><div class="label">Top-5</div><div class="metric" x-text="percent(selected.holderDistribution.top5Percent)"></div></div><div class="card"><div class="label">Top-10</div><div class="metric" x-text="percent(selected.holderDistribution.top10Percent)"></div></div><div class="card"><div class="label">Holder tunggal</div><div class="metric" x-text="percent(selected.holderDistribution.singlePercent)"></div></div><div class="card"><div class="label">Bundled supply</div><div class="metric" x-text="percent(selected.holderDistribution.bundledPercent)"></div></div></div><div class="small" style="margin-top:.8rem">Nilai yang belum tersedia dari WebSocket ditampilkan sebagai — dan tidak dianggap lulus.</div></section>
        <section class="table-wrap detail-panel"><h2>Ringkasan aktivitas</h2><div class="detail-grid" style="margin:0"><div class="card"><div class="label">Jumlah buy</div><div class="metric mint" x-text="selected.buyObserved"></div><div class="small" x-text="'Total kuantitas '+number(selected.buyAmount,2)"></div></div><div class="card"><div class="label">Jumlah sell</div><div class="metric" x-text="selected.sellObserved"></div><div class="small" x-text="'Total kuantitas '+number(selected.sellAmount,2)"></div></div><div class="card"><div class="label">Signal B / S 1m</div><div class="metric" x-text="number(selected.buys,0)+' / '+number(selected.sells,0)"></div></div><div class="card"><div class="label">Rasio sell/buy</div><div class="metric" x-text="ratio(selected)"></div></div></div><div style="overflow:auto"><table class="activity-table"><thead><tr><th>Arah</th><th>Waktu</th><th>Harga</th><th>Trader</th></tr></thead><tbody><template x-for="trade in selected.recentTrades" :key="trade.occurredAt+'-'+trade.side+'-'+(trade.actorAddress||'')"><tr><td><span class="badge" :class="trade.side==='buy'?'pass':'fail'" x-text="trade.side.toUpperCase()"></span></td><td x-text="formatTime(trade.occurredAt)"></td><td x-text="money(trade.priceUsd)"></td><td class="token" x-text="trade.actorAddress ? short(trade.actorAddress) : '—'"></td></tr></template></tbody></table></div></section>
        <section class="table-wrap detail-panel"><h2>Hasil setiap rule</h2><div class="checks"><template x-for="check in selected.checks"><div class="check"><span class="badge" :class="check.status.toLowerCase()" x-text="check.status"></span> <span x-text="check.name"></span><div class="small" x-text="check.detail"></div></div></template></div></section>
      </div>
    </template>
    <section class="table-wrap empty" x-show="data && !selected">Belum ada token pada tab detail. Dashboard akan menampilkan token berikutnya yang sedang diperiksa.</section>
    <section class="table-wrap empty" x-show="!data && !error">Menunggu snapshot monitor…</section>
  </main>
  <script>
    function dashboard(){return {data:null,error:'',get selected(){return this.data?.selectedToken||null},get generatedAt(){return this.data?.generatedAt},async load(){try{let r=await fetch('./dashboard-data.json?'+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('Snapshot belum tersedia');this.data=await r.json();this.error=''}catch(e){this.error=e.message}},short(v){return v?v.slice(0,5)+'…'+v.slice(-5):'—'},number(v,d=2){return v===null||v===undefined?'—':new Intl.NumberFormat('id-ID',{maximumFractionDigits:d}).format(v)},money(v){return v===null||v===undefined?'—':new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',notation:'compact',maximumFractionDigits:2}).format(v)},percent(v){return v===null||v===undefined?'—':v.toFixed(2)+'%'},ratio(t){return t.buys>0?((t.sells/t.buys)*100).toFixed(1)+'%':'—'},delta(v,d=0){if(v===null||v===undefined)return '—';return 'Δ '+(v>0?'+':'')+this.number(v,d)},formatTime(v){return new Date(v).toLocaleString('id-ID')}}}
  </script>
</body>
</html>
