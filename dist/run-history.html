<!doctype html>
<html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Riwayat run simulasi</title>
<style>body{margin:0;background:#09111d;color:#e8eff8;font:15px/1.5 system-ui,Segoe UI,sans-serif}main{max-width:1200px;margin:auto;padding:30px}.tabs{display:flex;gap:8px;margin:0 0 20px}.tabs a{padding:8px 12px;border:1px solid #426381;border-radius:7px;color:#b9d5f3;text-decoration:none}.tabs a.active{background:#235577;color:white}.muted{color:#9cafc5}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:20px 0}.card{padding:15px;background:#111e2e;border:1px solid #263950;border-radius:10px}.up{color:#62dfa8}.down{color:#ff9299}.open{color:#ffce76}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #263950}th{color:#a9c1df}a.report{display:inline-block;padding:6px 9px;border:1px solid #49739a;color:#b9d5f3;border-radius:6px;text-decoration:none}@media(max-width:800px){main{padding:16px}.grid{grid-template-columns:1fr 1fr}table{font-size:13px}}</style>
<main><nav class="tabs"><a href="/paper-simulation-report.html">Run terbaru</a><a class="active" href="/run-history.html">Riwayat run</a></nav><h1>Riwayat setiap run</h1><p class="muted">Run baru selalu memiliki report sendiri. Membuka report lama tidak mengubah report terbaru.</p><section class="grid" id="summary"></section><table><thead><tr><th>Mulai</th><th>Folder run</th><th>Buy</th><th>Sell</th><th>Terbuka</th><th>P/L selesai</th><th></th></tr></thead><tbody id="rows"><tr><td colspan="7" class="muted">Memuat riwayat…</td></tr></tbody></table></main>
<script>const n=v=>Number(v||0).toLocaleString('en-US',{maximumFractionDigits:6}),t=v=>new Date(v).toLocaleString('id-ID',{timeZone:'Asia/Jakarta'}),usd=v=>'$'+n(v);async function load(){const data=await fetch('/research-run-history.json',{cache:'no-store'}).then(r=>r.json()),runs=data.runs||[],total=runs.reduce((s,r)=>s+r.pnlUsd,0),buy=runs.reduce((s,r)=>s+r.buys,0),sell=runs.reduce((s,r)=>s+r.sells,0);document.querySelector('#summary').innerHTML=`<div class="card"><div class="muted">Jumlah run</div><b>${runs.length}</b></div><div class="card"><div class="muted">Total buy simulasi</div><b>${buy}</b></div><div class="card"><div class="muted">Total sell simulasi</div><b>${sell}</b></div><div class="card"><div class="muted">P/L run selesai</div><b class="${total>0?'up':total<0?'down':''}">${usd(total)}</b></div><div class="card"><div class="muted">Terakhir diperbarui</div><b>${t(data.generatedAt)}</b></div>`;document.querySelector('#rows').innerHTML=runs.length?runs.map(r=>`<tr><td>${t(r.startedAt)}</td><td>${r.folder}</td><td>${r.buys}</td><td>${r.sells}</td><td class="open">${r.open}</td><td class="${r.pnlUsd>0?'up':r.pnlUsd<0?'down':''}">${usd(r.pnlUsd)}</td><td>${r.reportAvailable?`<a class="report" href="/research-report/${encodeURIComponent(r.folder)}">Buka report</a>`:'—'}</td></tr>`).join(''):'<tr><td colspan="7" class="muted">Belum ada run.</td></tr>'}load().catch(()=>document.querySelector('#rows').innerHTML='<tr><td colspan="7">Riwayat tidak dapat dimuat.</td></tr>');setInterval(load,10000)</script>
